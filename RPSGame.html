<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CYBER SHOWDOWN - 霓虹猜拳對決</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Press+Start+2P&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0d0221;
      --neon-pink: #ff007f;
      --neon-cyan: #00f3ff;
      --neon-yellow: #ffe600;
      --neon-purple: #bc13fe;
      --dark-card: rgba(20, 10, 40, 0.75);
      --font-title: 'Press Start 2P', cursive;
      --font-display: 'Orbitron', sans-serif;
      --font-body: 'Rajdhani', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      background-color: var(--bg-color);
      color: #fff;
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    .background-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(180deg, rgba(13,2,33,1) 0%, rgba(45,10,78,1) 50%, rgba(255,0,127,0.2) 100%);
      z-index: -2;
    }

    .grid-lines {
      position: fixed;
      width: 200%;
      height: 100%;
      bottom: -30%;
      left: -50%;
      background-image: 
        linear-gradient(to right, rgba(0, 243, 255, 0.15) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 243, 255, 0.15) 1px, transparent 1px);
      background-size: 40px 40px;
      transform: perspective(300px) rotateX(60deg);
      animation: gridMove 4s linear infinite;
      z-index: -1;
    }

    @keyframes gridMove {
      0% { transform: perspective(300px) rotateX(60deg) translateY(0); }
      100% { transform: perspective(300px) rotateX(60deg) translateY(40px); }
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
    }

    .header-title {
      font-family: var(--font-title);
      font-size: 1.2rem;
      text-align: center;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan), 0 0 30px var(--neon-purple);
      margin-bottom: 5px;
      letter-spacing: 2px;
      line-height: 1.5;
    }

    .subtitle {
      font-family: var(--font-display);
      font-size: 0.85rem;
      letter-spacing: 3px;
      color: var(--neon-pink);
      text-shadow: 0 0 8px var(--neon-pink);
      margin-bottom: 25px;
      text-transform: uppercase;
    }

    .warning-banner {
      background: rgba(255, 0, 127, 0.2);
      border: 1px solid var(--neon-pink);
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
      box-shadow: 0 0 10px rgba(255,0,127,0.3);
      display: none;
    }

    .card {
      background: var(--dark-card);
      border: 2px solid var(--neon-cyan);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2), inset 0 0 15px rgba(0, 243, 255, 0.1);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .input-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-family: var(--font-display);
      font-size: 0.85rem;
      color: var(--neon-cyan);
      letter-spacing: 1px;
    }

    input[type="text"] {
      background: rgba(10, 5, 25, 0.8);
      border: 1.5px solid var(--neon-purple);
      border-radius: 8px;
      padding: 12px 16px;
      color: #fff;
      font-family: var(--font-display);
      font-size: 1.1rem;
      outline: none;
      box-shadow: inset 0 0 8px rgba(188, 19, 254, 0.3);
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    input[type="text"]:focus {
      border-color: var(--neon-pink);
      box-shadow: 0 0 10px var(--neon-pink), inset 0 0 10px rgba(255, 0, 127, 0.4);
    }

    .btn {
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1rem;
      padding: 14px 20px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(255, 0, 127, 0.4);
      transition: transform 0.1s, box-shadow 0.2s, background 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-secondary {
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.2), rgba(188, 19, 254, 0.2));
      border: 1px solid var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
    }

    .or-divider {
      text-align: center;
      margin: 15px 0;
      color: var(--neon-yellow);
      font-family: var(--font-display);
      font-size: 0.8rem;
      position: relative;
    }

    .or-divider::before, .or-divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 35%;
      height: 1px;
      background: rgba(255, 230, 0, 0.3);
    }

    .or-divider::before { left: 0; }
    .or-divider::after { right: 0; }

    .room-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px dashed rgba(0, 243, 255, 0.3);
      margin-bottom: 20px;
    }

    .room-badge {
      font-family: var(--font-display);
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      box-shadow: 0 0 8px rgba(0, 243, 255, 0.3);
    }

    .players-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .player-card {
      background: rgba(10, 5, 25, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.3s;
    }

    .player-card.is-me {
      border-color: var(--neon-pink);
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .player-name {
      font-family: var(--font-display);
      font-size: 1rem;
      color: #fff;
    }

    .player-status {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      font-family: var(--font-display);
    }

    .status-waiting {
      background: rgba(255, 230, 0, 0.2);
      color: var(--neon-yellow);
      border: 1px solid var(--neon-yellow);
    }

    .status-ready {
      background: rgba(0, 243, 255, 0.2);
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
    }

    .status-left {
      background: rgba(255, 0, 0, 0.2);
      color: #ff4d4d;
      border: 1px solid #ff4d4d;
    }

    .game-arena {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin: 15px 0;
    }

    .choice-display-area {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin-bottom: 10px;
    }

    .slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .slot-box {
      width: 75px;
      height: 75px;
      background: rgba(5, 2, 15, 0.8);
      border: 2px dashed var(--neon-purple);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
      transition: all 0.3s ease;
    }

    .slot-box.revealed {
      border-style: solid;
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px var(--neon-cyan);
      animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes pop {
      0% { transform: scale(0.8); }
      100% { transform: scale(1); }
    }

    .controls {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .choice-btn {
      background: rgba(20, 10, 40, 0.9);
      border: 2px solid var(--neon-purple);
      border-radius: 12px;
      padding: 16px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }

    .choice-btn:active, .choice-btn.selected {
      border-color: var(--neon-pink);
      background: rgba(255, 0, 127, 0.2);
      box-shadow: 0 0 15px var(--neon-pink);
      transform: translateY(-4px);
    }

    .choice-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    .choice-btn .emoji {
      font-size: 1.8rem;
    }

    .choice-btn .label {
      font-family: var(--font-display);
      font-size: 0.75rem;
      color: #fff;
    }

    .result-banner {
      font-family: var(--font-title);
      font-size: 0.95rem;
      text-align: center;
      margin: 15px 0;
      min-height: 30px;
      line-height: 1.5;
    }

    .res-win {
      color: var(--neon-cyan);
      text-shadow: 0 0 10px var(--neon-cyan);
    }

    .res-lose {
      color: var(--neon-pink);
      text-shadow: 0 0 10px var(--neon-pink);
    }

    .res-draw {
      color: var(--neon-yellow);
      text-shadow: 0 0 10px var(--neon-yellow);
    }

    .hidden {
      display: none !important;
    }

    .leave-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.3);
      color: #888;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }

    .score-badge {
      font-family: var(--font-display);
      font-size: 0.85rem;
      color: var(--neon-yellow);
    }

    .consent-modal {
      position: absolute;
      inset: 0;
      background: rgba(13, 2, 33, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
      border-radius: 16px;
      text-align: center;
      gap: 15px;
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getDatabase, ref, set, get, onValue, update, remove, onDisconnect 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCcEmPXYXDwCkUXyC5rXZCKAbv9_iOp7Kw",
      authDomain: "gamerps-37fd2.firebaseapp.com",
      databaseURL: "https://gamerps-37fd2-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gamerps-37fd2",
      storageBucket: "gamerps-37fd2.firebasestorage.app",
      messagingSenderId: "713743675941",
      appId: "1:713743675941:web:52929e35f4a597b37ac5cc"
    };

    let db;
    let isFirebaseConfigured = false;

    if (firebaseConfig.databaseURL && firebaseConfig.databaseURL.length > 0) {
      const app = initializeApp(firebaseConfig);
      db = getDatabase(app);
      isFirebaseConfigured = true;
    } else {
      document.getElementById('configWarning').style.display = 'block';
    }

    class SynthSound {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }
      playClick() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.05);
      }
      playWin() {
        if (!this.ctx) return;
        const notes = [261.63, 329.63, 392.00, 523.25];
        notes.forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.1);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime + i * 0.1);
          gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + i * 0.1 + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + i * 0.1);
          osc.stop(this.ctx.currentTime + i * 0.1 + 0.2);
        });
      }
      playLose() {
        if (!this.ctx) return;
        const notes = [300, 250, 200, 150];
        notes.forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.12);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime + i * 0.12);
          gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + i * 0.12 + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + i * 0.12);
          osc.stop(this.ctx.currentTime + i * 0.12 + 0.12);
        });
      }
    }

    const synth = new SynthSound();

    // 確保本機開多個分頁時 ID 絕對獨立不重複
    let myPlayerId = 'p_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
    let myName = '';
    let currentRoomId = null;
    let roomRef = null;
    let myChoice = null;
    let hasLockedChoice = false;
    let isHost = false;

    const emojiMap = {
      rock: '✊',
      paper: '✋',
      scissors: '✌️'
    };

    window.addEventListener('click', () => synth.init(), { once: true });
    window.addEventListener('touchstart', () => synth.init(), { once: true });

    document.getElementById('btnCreate').addEventListener('click', createRoom);
    document.getElementById('btnJoin').addEventListener('click', joinRoom);
    document.getElementById('btnLeave').addEventListener('click', leaveRoom);
    document.getElementById('btnReset').addEventListener('click', requestResetRound);
    document.getElementById('btnConsent').addEventListener('click', consentNewRound);

    document.querySelectorAll('.choice-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (hasLockedChoice) return;
        synth.playClick();
        makeChoice(btn.dataset.choice);
      });
    });

    async function createRoom() {
      if (!checkFirebaseConfig()) return;
      myName = document.getElementById('username').value.trim() || '玩家 1';
      const roomId = Math.floor(1000 + Math.random() * 9000).toString();
      currentRoomId = roomId;
      isHost = true;

      roomRef = ref(db, `rooms/${roomId}`);
      const playerData = {
        name: myName,
        score: 0,
        choice: null,
        active: true
      };

      await set(roomRef, {
        createdAt: Date.now(),
        roundState: 'playing',
        players: {
          [myPlayerId]: playerData
        }
      });

      setupOnDisconnect();
      listenToRoom();
      enterLobby();
    }

    async function joinRoom() {
      if (!checkFirebaseConfig()) return;
      const inputRoom = document.getElementById('roomInput').value.trim();
      if (!inputRoom || inputRoom.length !== 4) {
        alert('請輸入有效的 4 位數房號！');
        return;
      }

      myName = document.getElementById('username').value.trim() || '玩家 2';
      roomRef = ref(db, `rooms/${inputRoom}`);
      isHost = false;

      const snapshot = await get(roomRef);
      if (!snapshot.exists()) {
        alert('找不到此房間！');
        return;
      }

      const roomData = snapshot.val();
      const players = roomData.players || {};
      const existingPlayers = Object.keys(players);

      if (existingPlayers.length >= 3) {
        alert('房間已滿！(最多 3 人)');
        return;
      }

      currentRoomId = inputRoom;
      const playerData = {
        name: myName,
        score: 0,
        choice: null,
        active: true
      };

      await update(ref(db, `rooms/${inputRoom}/players/${myPlayerId}`), playerData);

      setupOnDisconnect();
      listenToRoom();
      enterLobby();
    }

    function setupOnDisconnect() {
      const myPlayerRef = ref(db, `rooms/${currentRoomId}/players/${myPlayerId}`);
      onDisconnect(myPlayerRef).update({ active: false, choice: null });
    }

    function leaveRoom() {
      if (roomRef && currentRoomId) {
        remove(ref(db, `rooms/${currentRoomId}/players/${myPlayerId}`));
      }
      currentRoomId = null;
      roomRef = null;
      myChoice = null;
      hasLockedChoice = false;
      isHost = false;
      document.getElementById('roomView').classList.add('hidden');
      document.getElementById('lobbyView').classList.remove('hidden');
      document.getElementById('consentModal').classList.add('hidden');
    }

    function enterLobby() {
      document.getElementById('lobbyView').classList.add('hidden');
      document.getElementById('roomView').classList.remove('hidden');
      document.getElementById('displayRoomId').innerText = currentRoomId;
      hasLockedChoice = false;
      setButtonsEnabled(true);
      document.getElementById('consentModal').classList.add('hidden');
    }

    async function makeChoice(choice) {
      if (hasLockedChoice) return;
      myChoice = choice;
      hasLockedChoice = true;
      setButtonsEnabled(false);

      document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
      document.querySelector(`[data-choice="${choice}"]`).classList.add('selected');

      await update(ref(db, `rooms/${currentRoomId}/players/${myPlayerId}`), {
        choice: choice
      });
    }

    function setButtonsEnabled(enabled) {
      document.querySelectorAll('.choice-btn').forEach(b => {
        b.disabled = !enabled;
      });
    }

    // 房主發起再來一局
    async function requestResetRound() {
      if (!isHost || !currentRoomId) return;
      await update(ref(db, `rooms/${currentRoomId}`), {
        roundState: 'waiting_consent'
      });
    }

    // 加入人員同意新一局（強制清除每位玩家的出拳紀錄並將狀態轉回 playing）
    async function consentNewRound() {
      if (!currentRoomId) return;
      const snapshot = await get(ref(db, `rooms/${currentRoomId}/players`));
      
      const updates = { roundState: 'playing' };
      if (snapshot.exists()) {
        snapshot.forEach(child => {
          updates[`players/${child.key}/choice`] = null;
        });
      }

      await update(ref(db, `rooms/${currentRoomId}`), updates);

      // 本地立即重置畫面狀態
      document.getElementById('resultBanner').innerText = '';
      document.getElementById('btnReset').classList.add('hidden');
      document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
      myChoice = null;
      hasLockedChoice = false;
      setButtonsEnabled(true);
      document.getElementById('consentModal').classList.add('hidden');
    }

    function listenToRoom() {
      onValue(roomRef, (snapshot) => {
        if (!snapshot.exists()) {
          alert('房間已被關閉或解散');
          leaveRoom();
          return;
        }

        const data = snapshot.val();
        const players = data.players || {};
        const playerIds = Object.keys(players);
        const roundState = data.roundState || 'playing';

        if (playerIds.length > 0) {
          isHost = (playerIds[0] === myPlayerId);
        }

        const listEl = document.getElementById('playersList');
        listEl.innerHTML = '';

        let choicesCount = 0;

        playerIds.forEach(pid => {
          const p = players[pid];
          const isMe = (pid === myPlayerId);
          const isActive = p.active !== false;

          if (isActive && p.choice) {
            choicesCount++;
          }

          const card = document.createElement('div');
          card.className = `player-card ${isMe ? 'is-me' : ''}`;
          
          let statusText = '等待中...';
          let statusClass = 'status-waiting';

          if (!isActive) {
            statusText = '玩家已退出';
            statusClass = 'status-left';
          } else if (p.choice) {
            statusText = '已出拳！';
            statusClass = 'status-ready';
          }

          card.innerHTML = `
            <div class="player-info">
              <span class="player-name">${p.name} ${isMe ? '(我)' : ''} ${pid === playerIds[0] ? '👑' : ''}</span>
              <span class="player-status ${statusClass}">${statusText}</span>
            </div>
            <div class="score-badge">分數: ${p.score || 0}</div>
          `;
          listEl.appendChild(card);
        });

        const slot1Box = document.getElementById('slot1Box');
        const slot2Box = document.getElementById('slot2Box');
        const resultBanner = document.getElementById('resultBanner');
        const btnReset = document.getElementById('btnReset');
        const consentModal = document.getElementById('consentModal');

        // 當資料庫狀態變回 playing 時，自動幫雙方關閉彈窗並解鎖本地出拳
        if (roundState === 'playing') {
          consentModal.classList.add('hidden');
          if (hasLockedChoice && resultBanner.innerText === '') {
            // 如果剛好重置，解鎖出拳
            hasLockedChoice = false;
            setButtonsEnabled(true);
            document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
          }
        } else if (roundState === 'waiting_consent') {
          if (!isHost) {
            consentModal.classList.remove('hidden');
          } else {
            btnReset.innerText = '等待對方同意...';
            btnReset.disabled = true;
          }
        } else {
          btnReset.innerText = '🔄 再來一局';
          btnReset.disabled = false;
        }

        const activePlayerIds = playerIds.filter(pid => players[pid].active !== false);

        if (activePlayerIds.length >= 2 && choicesCount >= 2 && activePlayerIds.every(pid => players[pid].choice)) {
          const p1Id = activePlayerIds[0];
          const p2Id = activePlayerIds[1];
          const p1 = players[p1Id];
          const p2 = players[p2Id];

          slot1Box.innerText = emojiMap[p1.choice];
          slot1Box.classList.add('revealed');
          slot2Box.innerText = emojiMap[p2.choice];
          slot2Box.classList.add('revealed');

          let winnerId = null;
          if (p1.choice === p2.choice) {
            resultBanner.innerText = '平手！';
            resultBanner.className = 'result-banner res-draw';
          } else if (
            (p1.choice === 'rock' && p2.choice === 'scissors') ||
            (p1.choice === 'paper' && p2.choice === 'rock') ||
            (p1.choice === 'scissors' && p2.choice === 'paper')
          ) {
            winnerId = p1Id;
            resultBanner.innerText = `${p1.name} 獲勝！`;
            resultBanner.className = `result-banner ${myPlayerId === p1Id ? 'res-win' : 'res-lose'}`;
            if (myPlayerId === p1Id) synth.playWin(); else synth.playLose();
          } else {
            winnerId = p2Id;
            resultBanner.innerText = `${p2.name} 獲勝！`;
            resultBanner.className = `result-banner ${myPlayerId === p2Id ? 'res-win' : 'res-lose'}`;
            if (myPlayerId === p2Id) synth.playWin(); else synth.playLose();
          }

          if (winnerId && roundState === 'playing' && myPlayerId === p1Id) {
            const currentScore = players[winnerId].score || 0;
            update(ref(db, `rooms/${currentRoomId}`), {
              roundState: 'scored',
              [`players/${winnerId}/score`]: currentScore + 1
            });
          }

          if (isHost) {
            btnReset.classList.remove('hidden');
          } else {
            btnReset.classList.add('hidden');
          }
        } else {
          if (roundState === 'playing' && resultBanner.innerText === '') {
            slot1Box.innerText = '❓';
            slot1Box.classList.remove('revealed');
            slot2Box.innerText = '❓';
            slot2Box.classList.remove('revealed');
          }
        }
      });
    }

    function checkFirebaseConfig() {
      if (!isFirebaseConfigured) {
        document.getElementById('configWarning').style.display = 'block';
        alert('請先在程式碼中填入 Firebase 設定！');
        return false;
      }
      return true;
    }
  </script>
</head>
<body>
  <div class="background-grid"></div>
  <div class="grid-lines"></div>

  <div class="container">
    <h1 class="header-title">CYBER SHOWDOWN</h1>
    <div class="subtitle">霓虹猜拳對決</div>

    <div id="configWarning" class="warning-banner">
      警告：尚未設定 Firebase 參數！
    </div>

    <!-- 進入大廳畫面 -->
    <div id="lobbyView" class="card">
      <div class="input-group">
        <label for="username">你的玩家暱稱</label>
        <input type="text" id="username" placeholder="輸入名稱 (預設玩家)" maxlength="12">
      </div>

      <button id="btnCreate" class="btn">
        <span>⚡ 建立新房間 (成為房主)</span>
      </button>

      <div class="or-divider">或加入房間</div>

      <div class="input-group">
        <label for="roomInput">4 位數房號</label>
        <input type="text" id="roomInput" placeholder="例: 1234" maxlength="4">
      </div>

      <button id="btnJoin" class="btn btn-secondary">
        <span>🔌 加入對戰</span>
      </button>
    </div>

    <!-- 遊戲對戰房間畫面 -->
    <div id="roomView" class="card hidden" style="position: relative;">
      
      <!-- 加入人員同意新局的彈窗 -->
      <div id="consentModal" class="consent-modal hidden">
        <h3 style="font-family: var(--font-title); color: var(--neon-cyan); font-size: 1rem;">房主請求再來一局</h3>
        <p style="font-size: 0.9rem; color: #ccc;">是否同意開始新的一局對戰？</p>
        <button id="btnConsent" class="btn" style="margin-top: 10px;">
          <span>✅ 同意並開始</span>
        </button>
      </div>

      <div class="room-header">
        <div class="room-badge">房號: <span id="displayRoomId">----</span></div>
        <button id="btnLeave" class="leave-btn">離開房間</button>
      </div>

      <div id="playersList" class="players-list">
        <!-- 動態帶入玩家 -->
      </div>

      <div class="game-arena">
        <div class="choice-display-area">
          <div class="slot">
            <div id="slot1Box" class="slot-box">❓</div>
          </div>
          <div style="display:flex; align-items:center; font-family:var(--font-title); color:var(--neon-yellow); font-size:1.2rem;">VS</div>
          <div class="slot">
            <div id="slot2Box" class="slot-box">❓</div>
          </div>
        </div>

        <div id="resultBanner" class="result-banner"></div>

        <div class="controls">
          <button class="choice-btn" data-choice="rock">
            <span class="emoji">✊</span>
            <span class="label">石頭</span>
          </button>
          <button class="choice-btn" data-choice="paper">
            <span class="emoji">✋</span>
            <span class="label">布</span>
          </button>
          <button class="choice-btn" data-choice="scissors">
            <span class="emoji">✌️</span>
            <span class="label">剪刀</span>
          </button>
        </div>

        <button id="btnReset" class="btn btn-secondary hidden" style="margin-top: 15px;">
          <span>🔄 再來一局</span>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
