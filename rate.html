            "GTQ": "瓜地馬拉格查爾",
            "HNL": "宏都拉斯倫皮拉",
            "NIO": "尼加拉瓜科多巴",
            "PAB": "巴拿馬巴波亞",
            "PYG": "巴拉圭瓜拉尼",
            "UYU": "烏拉圭披索",
            "BOB": "玻利維亞諾",
            "JMD": "牙買加元",
            "TTD": "千里達及托巴哥元",
            "BSD": "巴哈馬元",
            "BBD": "巴貝多元",
            "XCD": "東加勒比元",
            "XOF": "西非法郎",
            "XAF": "中非法郎",
            "XPF": "太平洋法郎",
            "MUR": "模里西斯盧比",
            "SCR": "塞席爾盧比",
            "MVR": "馬爾地夫拉菲亞",
            "IQD": "伊拉克第納爾",
            "JOD": "約旦第納爾",
            "LBP": "黎巴嫩鎊",
            "SYP": "敘利亞鎊",
            "YER": "葉門里亞爾",
            "AFN": "阿富汗尼",
            "ALL": "阿爾巴尼亞列克",
            "BAM": "波士尼亞可兌換馬克",
            "MKD": "北馬其頓第納爾",
            "MDL": "摩爾多瓦列伊",
            "BYN": "白俄羅斯盧布",
            "KGS": "吉爾吉斯索姆",
            "TJS": "塔吉克索莫尼",
            "TMT": "土庫曼馬納特",
            "AOA": "安哥拉寬扎",
            "BWP": "波札那普拉",
            "MZN": "莫三比克梅蒂卡爾",
            "NAD": "納米比亞元",
            "RWF": "盧安達法郎",
            "ZMW": "尚比亞克瓦查"
        };

        // 優先置頂顯示的常用貨幣代碼
        const PRIORITY_CURRENCIES = [
            "TWD", "JPY", "USD", "EUR", "KRW", "CNY", "HKD", "GBP", "AUD", "CAD", "SGD", "THB", "VND", "MYR", "PHP", "IDR", "CHF", "NZD"
        ];

        // 熱門看板展示幣別
        const POPULAR_CARDS = [
            { code: "JPY", flag: "🇯🇵", name: "日圓" },
            { code: "USD", flag: "🇺🇸", name: "美元" },
            { code: "KRW", flag: "🇰🇷", name: "韓元" },
            { code: "EUR", flag: "🇪🇺", name: "歐元" },
            { code: "CNY", flag: "🇨🇳", name: "人民幣" },
            { code: "HKD", flag: "🇭🇰", name: "港幣" }
        ];

        let rates = {};
        let lastEditedSide = 'left';

        const leftSelect = document.getElementById('left-currency');
        const rightSelect = document.getElementById('right-currency');
        const leftInput = document.getElementById('left-amount');
        const rightInput = document.getElementById('right-amount');
        const swapBtn = document.getElementById('swap-btn');
        const swapIcon = document.getElementById('swap-icon');
        const rateDisplay = document.getElementById('rate-display');
        const inverseRateDisplay = document.getElementById('inverse-rate-display');
        const statusDot = document.getElementById('status-dot');
        const updateTimeEl = document.getElementById('update-time');
        const countBadgeEl = document.getElementById('currency-count-badge');
        const clearLeftBtn = document.getElementById('clear-left');
        const copyRightBtn = document.getElementById('copy-right');
        const copyTextEl = document.getElementById('copy-text');
        const popularGrid = document.getElementById('popular-grid');
        const boardSubtitle = document.getElementById('board-subtitle');

        function showStatus(msg) {
            const banner = document.getElementById('status-banner');
            document.getElementById('status-message').textContent = msg;
            banner.classList.remove('hidden');
        }

        function formatAmount(value, currencyCode) {
            if (isNaN(value) || value === null) return '';
            if (value === 0) return '0';

            const zeroDecimalPreferred = ['JPY', 'KRW', 'VND', 'IDR', 'CLP', 'PYG', 'UGX', 'RWF'];
            if (zeroDecimalPreferred.includes(currencyCode) && Math.abs(value) >= 1) {
                return Number(value.toFixed(2)).toString();
            }

            if (Math.abs(value) < 0.01) {
                return Number(value.toPrecision(4)).toString();
            }
            return Number(value.toFixed(4)).toString();
        }

        function formatDisplayNumber(value, currencyCode) {
            const raw = formatAmount(value, currencyCode);
            if (!raw) return '--';
            const parts = raw.split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            return parts.join('.');
        }

        function formatRate(rate) {
            if (!rate || isNaN(rate)) return '--';
            if (rate >= 100) return rate.toFixed(2);
            if (rate >= 1) return rate.toFixed(4);
            return rate.toFixed(6);
        }

        function getCurrencyLabel(code) {
            const name = CURRENCY_NAMES[code];
            return name ? `${code} - ${name}` : `${code}`;
        }

        function populateCurrencySelects(availableCodes) {
            const currentLeft = leftSelect.value || 'TWD';
            const currentRight = rightSelect.value || 'JPY';

            const prioritySet = new Set(PRIORITY_CURRENCIES);
            const topCodes = PRIORITY_CURRENCIES.filter(code => availableCodes.includes(code));
            const otherCodes = availableCodes.filter(code => !prioritySet.has(code)).sort();

            function buildOptions(selectEl, selectedCode) {
                selectEl.innerHTML = '';

                const topGroup = document.createElement('optgroup');
                topGroup.label = '常用貨幣';
                topCodes.forEach(code => {
                    const opt = document.createElement('option');
                    opt.value = code;
                    opt.textContent = getCurrencyLabel(code);
                    if (code === selectedCode) opt.selected = true;
                    topGroup.appendChild(opt);
                });
                selectEl.appendChild(topGroup);

                if (otherCodes.length > 0) {
                    const otherGroup = document.createElement('optgroup');
                    otherGroup.label = '全球其他貨幣 (A-Z)';
                    otherCodes.forEach(code => {
                        const opt = document.createElement('option');
                        opt.value = code;
                        opt.textContent = getCurrencyLabel(code);
                        if (code === selectedCode) opt.selected = true;
                        otherGroup.appendChild(opt);
                    });
                    selectEl.appendChild(otherGroup);
                }
            }

            buildOptions(leftSelect, availableCodes.includes(currentLeft) ? currentLeft : 'TWD');
            buildOptions(rightSelect, availableCodes.includes(currentRight) ? currentRight : 'JPY');
        }

        function renderPopularCards() {
            const leftCode = leftSelect.value;
            const rightCode = rightSelect.value;
            const baseAmount = parseFloat(leftInput.value);
            const validAmount = (!isNaN(baseAmount) && baseAmount > 0) ? baseAmount : 1000;

            if (!rates[leftCode]) return;

            boardSubtitle.textContent = `以 ${formatDisplayNumber(validAmount, leftCode)} ${leftCode} 為基準的常用貨幣試算`;

            popularGrid.innerHTML = POPULAR_CARDS.map(item => {
                // 若左側本身就是該熱門幣別，改顯示 TWD
                const displayCode = (item.code === leftCode) ? (leftCode === 'TWD' ? 'USD' : 'TWD') : item.code;
                const displayMeta = POPULAR_CARDS.find(c => c.code === displayCode) || { code: 'TWD', flag: '🇹🇼', name: '新台幣' };

                if (!rates[displayCode]) return '';

                const rate = rates[displayCode] / rates[leftCode];
                const convertedVal = validAmount * rate;
                const isSelected = (displayCode === rightCode);

                return `
                    <button type="button" onclick="selectTargetCurrency('${displayCode}')"
                            class="glass-card-hover text-left rounded-xl p-4 border transition-all cursor-pointer flex items-center justify-between gap-3 ${isSelected ? 'bg-white/10 border-wdx-mint/40' : 'bg-white/5 border-white/10'}">
                        <div class="flex items-center gap-3 min-w-0">
                            <span class="text-2xl select-none shrink-0">${displayMeta.flag}</span>
                            <div class="min-w-0">
                                <div class="flex items-center gap-1.5">
                                    <span class="text-sm font-bold text-white">${displayMeta.code}</span>
                                    <span class="text-xs text-slate-400 truncate">${displayMeta.name}</span>
                                </div>
                                <p class="text-[11px] text-slate-400 mt-0.5">1 ${leftCode} = ${formatRate(rate)} ${displayMeta.code}</p>
                            </div>
                        </div>
                        <div class="text-right shrink-0">
                            <p class="text-sm sm:text-base font-bold ${isSelected ? 'text-wdx-mint' : 'text-white'}">${formatDisplayNumber(convertedVal, displayMeta.code)}</p>
                            <p class="text-[10px] ${isSelected ? 'text-wdx-mint' : 'text-slate-500'}">${isSelected ? '目前目標' : '點擊切換'}</p>
                        </div>
                    </button>
                `;
            }).join('');
        }

        function selectTargetCurrency(targetCode) {
            if (!rates[targetCode]) return;
            if (leftSelect.value === targetCode) {
                leftSelect.value = targetCode === 'TWD' ? 'USD' : 'TWD';
            }
            rightSelect.value = targetCode;
            calculate('left');
        }

        function calculate(sourceSide = lastEditedSide) {
            const leftCode = leftSelect.value;
            const rightCode = rightSelect.value;

            if (!rates[leftCode] || !rates[rightCode]) return;

            const crossRate = rates[rightCode] / rates[leftCode];
            const inverseRate = rates[leftCode] / rates[rightCode];

            rateDisplay.textContent = `1 ${leftCode} = ${formatRate(crossRate)} ${rightCode}`;
            inverseRateDisplay.textContent = `1 ${rightCode} = ${formatRate(inverseRate)} ${leftCode}`;

            if (sourceSide === 'left') {
                const rawLeft = parseFloat(leftInput.value);
                if (leftInput.value === '' || isNaN(rawLeft)) {
                    rightInput.value = '';
                } else {
                    const converted = rawLeft * crossRate;
                    rightInput.value = formatAmount(converted, rightCode);
                }
            } else {
                const rawRight = parseFloat(rightInput.value);
                if (rightInput.value === '' || isNaN(rawRight)) {
                    leftInput.value = '';
                } else {
                    const converted = rawRight * inverseRate;
                    leftInput.value = formatAmount(converted, leftCode);
                }
            }

            renderPopularCards();
        }

        async function fetchExchangeRates() {
            statusDot.className = 'inline-block w-2 h-2 rounded-full bg-amber-400 animate-pulse';
            updateTimeEl.textContent = '資料更新中...';

            const endpoints = [
                'https://open.er-api.com/v6/latest/USD',
                'https://api.exchangerate-api.com/v4/latest/USD'
            ];

            let success = false;

            for (const url of endpoints) {
                try {
                    const response = await fetch(url, { cache: 'no-store' });
                    if (!response.ok) continue;
                    const data = await response.json();

                    if (data && data.rates && data.rates.TWD && data.rates.JPY) {
                        rates = data.rates;
                        const codes = Object.keys(rates);
                        populateCurrencySelects(codes);

                        const now = new Date();
                        const hhmm = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

                        statusDot.className = 'inline-block w-2 h-2 rounded-full bg-wdx-mint animate-pulse';
                        updateTimeEl.textContent = `更新於 ${hhmm}`;
                        countBadgeEl.textContent = `支援 ${codes.length} 種貨幣`;
                        document.getElementById('status-banner').classList.add('hidden');

                        try {
                            localStorage.setItem('cached_fx_rates', JSON.stringify({
                                rates: rates,
                                timestamp: hhmm
                            }));
                        } catch (e) {}

                        calculate(lastEditedSide);
                        success = true;
                        break;
                    }
                } catch (err) {
                    console.warn('API 連線失敗，嘗試備援來源:', url, err);
                }
            }

            if (!success) {
                try {
                    const cached = JSON.parse(localStorage.getItem('cached_fx_rates'));
                    if (cached && cached.rates) {
                        rates = cached.rates;
                        populateCurrencySelects(Object.keys(rates));
                        statusDot.className = 'inline-block w-2 h-2 rounded-full bg-amber-400';
                        updateTimeEl.textContent = `快取於 ${cached.timestamp}`;
                        showStatus('目前無法連線至最新匯率伺服器，已自動載入上次快取的匯率數據。');
                        calculate(lastEditedSide);
                        return;
                    }
                } catch (e) {}

                statusDot.className = 'inline-block w-2 h-2 rounded-full bg-rose-500';
                updateTimeEl.textContent = '連線失敗';
                showStatus('匯率資料載入失敗，請檢查網路連線或點擊「更新匯率」重試。');
            }
        }

        function resetDefaultPair() {
            leftSelect.value = 'TWD';
            rightSelect.value = 'JPY';
            leftInput.value = '1000';
            lastEditedSide = 'left';
            calculate('left');
        }

        leftInput.addEventListener('input', () => {
            lastEditedSide = 'left';
            calculate('left');
        });

        rightInput.addEventListener('input', () => {
            lastEditedSide = 'right';
            calculate('right');
        });

        leftSelect.addEventListener('change', () => {
            calculate(lastEditedSide);
        });

        rightSelect.addEventListener('change', () => {
            calculate(lastEditedSide);
        });

        let rotation = 0;
        swapBtn.addEventListener('click', () => {
            const tempCurrency = leftSelect.value;
            leftSelect.value = rightSelect.value;
            rightSelect.value = tempCurrency;

            rotation += 180;
            if (window.innerWidth >= 768) {
                swapIcon.style.transform = `rotate(${rotation}deg)`;
            } else {
                swapIcon.style.transform = `rotate(${rotation + 90}deg)`;
            }

            calculate('left');
        });

        clearLeftBtn.addEventListener('click', () => {
            leftInput.value = '';
            rightInput.value = '';
            leftInput.focus();
            renderPopularCards();
        });

        copyRightBtn.addEventListener('click', async () => {
            if (!rightInput.value) return;
            try {
                await navigator.clipboard.writeText(rightInput.value);
                copyTextEl.textContent = '已複製！';
                copyRightBtn.classList.add('text-wdx-mint');
                setTimeout(() => {
                    copyTextEl.textContent = '複製金額';
                    copyRightBtn.classList.remove('text-wdx-mint');
                }, 1500);
            } catch (err) {
                rightInput.select();
                document.execCommand('copy');
            }
        });

        document.querySelectorAll('.quick-amt').forEach(btn => {
            btn.addEventListener('click', () => {
                leftInput.value = btn.getAttribute('data-amt');
                lastEditedSide = 'left';
                calculate('left');
            });
        });

        window.addEventListener('DOMContentLoaded', () => {
            fetchExchangeRates();
        });
    </script>
</body>
</html>
